# Coolify: new resource → Docker Compose → this repository.
# Coolify terminates TLS and routes the domain to the exposed port.
# This file builds the installable PWA only. Tauri stays on the desktop.
#
# Coolify injects Environment Variables for ${} substitution (no env_file
# required). Hardcoded values here block those overrides.
# Build-time public flags go under build.args. The runtime container is
# static nginx on port 80 and has no environment block.
# Do not set RUNPOD_*, AWS_*, S3_*, or any provider secret on this resource.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public build-time flag. Empty unless Coolify (or the shell) sets it.
        VITE_PUBLIC_BASE_URL: ${VITE_PUBLIC_BASE_URL:-}
    image: wckd-web
    restart: unless-stopped
    expose:
      - "80"
    # No runtime environment. Static files on nginx :80; Coolify's proxy
    # terminates TLS. Do not add PORT, secrets, or env_file.
    # Coolify assigns the public port. Uncomment only for a local smoke test:
    # ports:
    #   - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
