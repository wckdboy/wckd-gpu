[package]
name = "wckd-desktop"
version = "0.1.0"
description = "wckd-gpu desktop shell"
authors = ["WCKD"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "wckd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
